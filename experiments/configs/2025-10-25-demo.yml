data:
  # Can be DB or file
  #path: "input.csv"
  # will needs id and text
  query: 'Select id, text from "Document" where text like ''%renewable energy%'' limit 2'

filter:
  QueryStringFilter:
    qs: "'renewable energy'"

processor:
  context_size: 3
  sentence_splitting_function: nltk.tokenize.sent_tokenize

elementfilter:
  QueryStringFilter:
    qs: "'energy'"

extractor:
  ZeroShotExtractor:
    model_key: "gpt-4o-mini"
    endpoint: "https://api.openai.com/v1/chat/completions"
    system_prompt: "You are ChatGPT, a helpful assistant."
    message_prompt_format_string: "{string}: {context}"

deconstructor:
  ZeroShotDeconstructor:
    model_key: "gpt-4o-mini"
    endpoint: "https://api.openai.com/v1/chat/completions"
    system_prompt: "You are ChatGPT, a helpful assistant."
    message_prompt_format_string: "{string}"
