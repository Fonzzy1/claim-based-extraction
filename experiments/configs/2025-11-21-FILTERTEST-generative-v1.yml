# Generate the stuff from the ./.schema_generator.py
# yaml-language-server: $schema=./.schema.json
data:
  file: data/labeled/filter/labeled_examples.pkl
filter:
  GenerativeFilter:
    model: gemma3:12b
    endpoint: "http://ollama:11434/v1/"
    temp: 0.8
    query: |
      You are a filter for Australian hansard speeches
      You will be provided with the title of the speech and you will tell me if it is about energy generation policy or not.
      If unsure, include it.
