data:
  file: data/labeled/filter/labeled_examples.pkl
filter:
  ScikitFilter:
    training_data_path: data/synthetic/25k_generative_filter_output/training_data.csv
    embedding_model: sklearn.feature_extraction.text.HashingVectorizer
    embedding_args:
      ngram_range:
      - 1
      - 3
      n_features: 65536
      alternate_sign: true
    classifier_model: sklearn.linear_model.LogisticRegression
    classifier_args:
      max_iter: 300
      C: 3.0
      penalty: l2
      solver: lbfgs
