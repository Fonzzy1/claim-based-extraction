data:
  file: data/labeled/filter/labeled_examples.pkl
filter:
  ScikitFilter:
    training_data_path: data/synthetic/25k_generative_filter_output/training_data.csv
    embedding_model: sklearn.feature_extraction.text.TfidfVectorizer
    embedding_args:
      ngram_range:
      - 1
      - 1
      min_df: 2
      use_idf: false
      smooth_idf: false
    classifier_model: sklearn.naive_bayes.MultinomialNB
    classifier_args:
      alpha: 1.0
