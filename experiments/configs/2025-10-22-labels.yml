data:
  # Can be DB or file
  #path: "input.csv"
  # will needs id and text
  query: 'Select id, text from "Document" where text like ''%renewable energy%'' limit 2'

filter:
  QueryStringFilter:
    qs: "'renewable energy' OR 'renewable power' OR 'clean energy' OR 'sustainable energy'"

processor:
  context_size: 3
  sentence_splitting_function: nltk.tokenize.sent_tokenize

elementfilter:
  QueryStringFilter:
    qs: "'energy'"

extractor:
  LabelingExtractor: {}

deconstructor:
  LabelingDeconstructor: {}
